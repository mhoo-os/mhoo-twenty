name: Sign existing Twenty v2.30.1 candidate 4

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: sign-existing-twenty-v2.30.1-candidate-4
  cancel-in-progress: false

env:
  BUILD_ID: mhoo-twenty-v2.30.1-candidate.4
  CANDIDATE_DIGEST: sha256:c0f7f17aadec0ba66e6fbd94e4733ec33116ba64c5c4c23b1a666e48867cd2f5
  CANDIDATE_SOURCE_REVISION: d6f09ee3e0df280d3e3a67c00636532e3fac2536
  CANDIDATE_TAG: mhoo/candidate/v2.30.1-4
  CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-twenty-v2.30.1-candidate-4.yml@${{ github.ref }}
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  IMAGE_REF: ghcr.io/mhoo-os/mhoo-twenty@sha256:c0f7f17aadec0ba66e6fbd94e4733ec33116ba64c5c4c23b1a666e48867cd2f5
  IMAGE_TAG: ghcr.io/mhoo-os/mhoo-twenty:v2.30.1-4
  PUBLICATION_RUN: https://github.com/mhoo-os/mhoo-twenty/actions/runs/32594715632

jobs:
  sign-existing:
    name: Revalidate, sign, and verify existing digest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out canonical controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate and canonical upstream objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/tags/${CANDIDATE_TAG}:refs/tags/${CANDIDATE_TAG}"
          git fetch --no-tags https://github.com/twentyhq/twenty.git \
            refs/tags/twenty/v2.30.0 \
            refs/tags/twenty/v2.30.1

      - name: Verify source, tag, and continuation boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="refs/tags/${CANDIDATE_TAG}"

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "sign-only continuation must run from canonical main" >&2
            exit 1
          }
          [[ "$(git cat-file -t "$candidate_ref")" == "tag" ]] || {
            echo "candidate ref must remain an annotated tag" >&2
            exit 1
          }
          [[ "$(git rev-list -n 1 "$candidate_ref")" == "$CANDIDATE_SOURCE_REVISION" ]] || {
            echo "candidate tag no longer resolves to the published source revision" >&2
            exit 1
          }
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_REVISION" HEAD || {
            echo "published candidate source is not an ancestor of canonical main" >&2
            exit 1
          }

          scripts/provenance/verify-source.sh

      - name: Set up registry inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the registry tag still resolves to the validated digest
        shell: bash
        run: |
          set -euo pipefail
          resolved_digest="$(
            docker buildx imagetools inspect "$IMAGE_TAG" |
              sed -n 's/^Digest:[[:space:]]*//p' |
              head -n 1
          )"
          [[ "$resolved_digest" == "$CANDIDATE_DIGEST" ]] || {
            echo "candidate registry tag mismatch: expected ${CANDIDATE_DIGEST}, got ${resolved_digest}" >&2
            exit 1
          }

      - name: Pull the exact validated digest
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Revalidate the exact digest before signing
        env:
          IMAGE_NAME: ${{ env.IMAGE_REF }}
          REPORT_PATH: ${{ runner.temp }}/candidate-validation.json
          SOURCE_REVISION: ${{ env.CANDIDATE_SOURCE_REVISION }}
        run: scripts/provenance/validate-candidate.sh

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Sign the existing digest with GitHub OIDC
        id: sign
        shell: bash
        run: |
          set -euo pipefail

          if cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$IMAGE_REF" >/dev/null 2>&1; then
            echo "The exact workflow identity has already signed this digest; skipping duplicate signature."
            echo "created=false" >>"$GITHUB_OUTPUT"
          else
            cosign sign --yes "$IMAGE_REF"
            echo "created=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Verify the digest-bound keyless signature
        env:
          VERIFICATION_PATH: ${{ runner.temp }}/cosign-verification.json
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            --output json \
            "$IMAGE_REF" | tee "$VERIFICATION_PATH"
          jq -e 'length > 0' "$VERIFICATION_PATH" >/dev/null

      - name: Record completed custody receipt
        env:
          SIGNATURE_CREATED: ${{ steps.sign.outputs.created }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_directory="$RUNNER_TEMP/candidate-custody"
          mkdir -p "$receipt_directory"

          cp "$RUNNER_TEMP/candidate-validation.json" \
            "$receipt_directory/validation.json"
          cp "$RUNNER_TEMP/cosign-verification.json" \
            "$receipt_directory/signature-verification.json"

          jq -n \
            --arg buildId "$BUILD_ID" \
            --arg candidateTag "$CANDIDATE_TAG" \
            --arg certificateIdentity "$CERTIFICATE_IDENTITY" \
            --arg certificateOidcIssuer "$CERTIFICATE_OIDC_ISSUER" \
            --arg digest "$CANDIDATE_DIGEST" \
            --arg imageRef "$IMAGE_REF" \
            --arg publicationRun "$PUBLICATION_RUN" \
            --arg signatureCreated "$SIGNATURE_CREATED" \
            --arg signingRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg sourceRevision "$CANDIDATE_SOURCE_REVISION" \
            '{
              result: "passed",
              candidateTag: $candidateTag,
              sourceRevision: $sourceRevision,
              buildId: $buildId,
              imageRef: $imageRef,
              digest: $digest,
              publicationRun: $publicationRun,
              validation: "passed",
              signature: {
                mode: "keyless",
                createdByThisRun: ($signatureCreated == "true"),
                certificateIdentity: $certificateIdentity,
                certificateOidcIssuer: $certificateOidcIssuer,
                verification: "passed"
              },
              signingRun: $signingRun,
              nonClaims: ["sbom", "slsa-or-in-toto-attestation", "vulnerability-policy"]
            }' >"$receipt_directory/custody.json"

          {
            echo "## Signed migration candidate"
            echo
            echo "- Source revision: \`${CANDIDATE_SOURCE_REVISION}\`"
            echo "- Candidate tag: \`${CANDIDATE_TAG}\`"
            echo "- Digest-only image: \`${IMAGE_REF}\`"
            echo "- Exact-digest revalidation: PASS"
            echo "- Keyless signature verification: PASS"
            echo "- Rehearsal and deployment: not performed"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve completed custody receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mhoo-twenty-v2.30.1-candidate-4-signed-custody
          path: ${{ runner.temp }}/candidate-custody/
          if-no-files-found: error
          retention-days: 90
