name: Publish signed Twenty v2.37.0 candidate by digest

on:
  workflow_dispatch:
    inputs:
      candidate_number:
        description: Immutable positive candidate number
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: twenty-v2.37.0-candidate-${{ inputs.candidate_number }}
  cancel-in-progress: false

env:
  BUILD_ID: mhoo-twenty-v2.37.0-candidate.${{ inputs.candidate_number }}
  CANDIDATE_SOURCE_TAG: mhoo/candidate/v2.37.0-${{ inputs.candidate_number }}
  EXPECTED_REPOSITORY: mhoo-os/mhoo-twenty
  EXPECTED_UPSTREAM_TAG: twenty/v2.37.0
  EXPECTED_UPSTREAM_COMMIT: 6da524b8903ec16a3eeea4b2e4a5fb63dbfc1c58
  EXPECTED_UPSTREAM_TREE: 3ce4ef3eac3604ee52b6b8ee0f1a4766d7f533ca
  EXPECTED_WORKFLOW_REF: refs/heads/main
  SOURCE_REMOTE: https://github.com/mhoo-os/mhoo-twenty.git
  IMAGE_REPOSITORY: ghcr.io/mhoo-os/mhoo-twenty
  REGISTRY_API: https://ghcr.io/v2/mhoo-os/mhoo-twenty
  CERTIFICATE_IDENTITY: https://github.com/mhoo-os/mhoo-twenty/.github/workflows/publish-twenty-v2.37.0-candidate.yml@refs/heads/main
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_RELEASE: v2.6.1
  COSIGN_DOWNLOAD_URL: https://github.com/sigstore/cosign/releases/download/v2.6.1/cosign-linux-amd64
  COSIGN_SHA256: 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a
  ACTIONLINT_DOWNLOAD_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
  ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  publish:
    name: Build once, publish by digest, validate, sign, and receipt
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tools="$RUNNER_TEMP/actionlint"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "$ACTIONLINT_DOWNLOAD_URL" --output "$archive"
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$ACTIONLINT_ARCHIVE_SHA256" ]]
          tar -xzf "$archive" -C "$tools" actionlint
          chmod 0755 "$tools/actionlint"
          "$tools/actionlint" -version | grep -Fx '1.7.12'
          echo "$tools" >>"$GITHUB_PATH"

      - name: Validate publication workflow contract
        run: scripts/provenance/validate-v2.37.0-publication-workflow.sh

      - name: Resolve exact annotated candidate tag
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || { echo "unexpected repository" >&2; exit 1; }
          [[ "$GITHUB_REF" == "$EXPECTED_WORKFLOW_REF" ]] || { echo "workflow must be dispatched from main" >&2; exit 1; }
          [[ "${{ inputs.candidate_number }}" =~ ^[1-9][0-9]*$ ]] || { echo "candidate number must be a positive integer" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "workflow checkout mismatch" >&2; exit 1; }
          workflow_blob="$(git rev-parse "${GITHUB_SHA}:.github/workflows/publish-twenty-v2.37.0-candidate.yml")"
          expected_ref="refs/tags/${CANDIDATE_SOURCE_TAG}"
          remote_refs="$(git ls-remote --tags "$SOURCE_REMOTE" "$expected_ref" "${expected_ref}^{}")"
          tag_object="$(awk -v ref="$expected_ref" '$2 == ref { print $1 }' <<<"$remote_refs")"
          source_revision="$(awk -v ref="${expected_ref}^{}" '$2 == ref { print $1 }' <<<"$remote_refs")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ && "$source_revision" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate tag is missing or not annotated" >&2; exit 1; }
          [[ "$source_revision" == "$GITHUB_SHA" ]] || { echo "candidate tag must point to the reviewed workflow commit" >&2; exit 1; }
          git fetch --no-tags "$SOURCE_REMOTE" "${expected_ref}:${expected_ref}"
          [[ "$(git cat-file -t "$expected_ref")" == tag ]] || { echo "candidate source tag must be annotated" >&2; exit 1; }
          [[ "$(git rev-parse "$expected_ref")" == "$tag_object" ]] || { echo "candidate tag object changed" >&2; exit 1; }
          source_tree="$(git rev-parse "${expected_ref}^{commit}^{tree}")"
          [[ "$source_tree" == "$(git rev-parse "${GITHUB_SHA}^{tree}")" ]] || { echo "candidate source tree mismatch" >&2; exit 1; }
          tagger_name="$(git for-each-ref --format='%(taggername)' "$expected_ref")"
          tagger_email="$(git for-each-ref --format='%(taggeremail)' "$expected_ref")"
          tagger_date="$(git for-each-ref --format='%(taggerdate:iso-strict)' "$expected_ref")"
          annotation_sha256="$(git cat-file tag "$tag_object" | sha256sum | awk '{print $1}')"
          [[ -n "$tagger_name" && -n "$tagger_email" && -n "$tagger_date" ]] || { echo "candidate tagger metadata is incomplete" >&2; exit 1; }
          {
            echo "source_revision=${source_revision}"
            echo "source_tree=${source_tree}"
            echo "tag_object=${tag_object}"
            echo "tagger_name=${tagger_name}"
            echo "tagger_email=${tagger_email}"
            echo "tagger_date=${tagger_date}"
            echo "annotation_sha256=${annotation_sha256}"
            echo "workflow_blob=${workflow_blob}"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch and verify governed upstream source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/twentyhq/twenty.git refs/tags/twenty/v2.37.0
          scripts/provenance/verify-source.sh
          [[ "$(sed -n 's/^TWENTY_UPSTREAM_REF=refs\/tags\///p' .twenty-source)" == "$EXPECTED_UPSTREAM_TAG" ]]
          [[ "$(sed -n 's/^TWENTY_UPSTREAM_COMMIT=//p' .twenty-source)" == "$EXPECTED_UPSTREAM_COMMIT" ]]
          [[ "$(sed -n 's/^TWENTY_UPSTREAM_TREE=//p' .twenty-source)" == "$EXPECTED_UPSTREAM_TREE" ]]

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build candidate once as an OCI layout
        id: build
        env:
          IMAGE_NAME: mhoo-os/mhoo-twenty
          METADATA_PATH: ${{ runner.temp }}/v237-build-metadata.json
          OUTPUT_MODE: oci
          OUTPUT_PATH: ${{ runner.temp }}/v237-candidate.oci.tar
          SOURCE_REPOSITORY: https://github.com/mhoo-os/mhoo-twenty
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/provenance/build-v2.37.0-candidate.sh
          buildx_digest="$(jq -er '."containerimage.digest"' "$METADATA_PATH")"
          [[ "$buildx_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "buildx_digest=${buildx_digest}"
            echo "buildx_version=$(docker buildx version)"
            echo "docker_version=$(docker version --format '{{json .}}')"
          } >>"$GITHUB_OUTPUT"

      - name: Authenticate exact-digest client
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish closed OCI graph by digest and read it back
        id: registry
        env:
          BUILD_CLAIMED_DIGEST: ${{ steps.build.outputs.buildx_digest }}
          GITHUB_TOKEN: ${{ github.token }}
          OCI_LAYOUT: ${{ runner.temp }}/v237-oci-layout
          OCI_PUBLICATION_EVIDENCE_DIRECTORY: ${{ runner.temp }}/v237-raw-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OCI_LAYOUT"
          tar -xf "$RUNNER_TEMP/v237-candidate.oci.tar" -C "$OCI_LAYOUT"
          scripts/provenance/publish-oci-layout.sh

      - name: Pull and validate authoritative digest
        env:
          BUILD_ID: ${{ env.BUILD_ID }}
          CANDIDATE_DIGEST: ${{ steps.registry.outputs.digest }}
          IMAGE_NAME: ${{ steps.registry.outputs.image_ref }}
          REPORT_PATH: ${{ runner.temp }}/v237-validation.json
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE_NAME"
          scripts/provenance/validate-v2.37.0-candidate.sh

      - name: Obtain verified Cosign executable
        id: cosign
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/cosign-linux-amd64"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 "$COSIGN_DOWNLOAD_URL" --output "$path"
          sha256="$(sha256sum "$path" | awk '{print $1}')"
          [[ "$sha256" == "$COSIGN_SHA256" ]]
          chmod 0755 "$path"
          version="$($path version --json)"
          jq -e --arg release "$COSIGN_RELEASE" '.gitVersion == $release' <<<"$version" >/dev/null
          { echo "path=${path}"; echo "sha256=${sha256}"; echo "version=$(jq -r '.gitVersion' <<<"$version")"; } >>"$GITHUB_OUTPUT"

      - name: Sign and verify authoritative digest
        env:
          COSIGN_PATH: ${{ steps.cosign.outputs.path }}
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          VERIFICATION_PATH: ${{ runner.temp }}/v237-raw-evidence/signature-verification.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sha256sum "$COSIGN_PATH" | awk '{print $1}')" == "$COSIGN_SHA256" ]]
          "$COSIGN_PATH" sign --yes "$IMAGE_REF"
          "$COSIGN_PATH" verify --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" --output json "$IMAGE_REF" >"$VERIFICATION_PATH"
          jq -e 'type == "array" and length > 0' "$VERIFICATION_PATH" >/dev/null

      - name: Create raw evidence bundle
        env:
          BUILDX_DIGEST: ${{ steps.build.outputs.buildx_digest }}
          BUILDX_VERSION: ${{ steps.build.outputs.buildx_version }}
          COSIGN_VERSION: ${{ steps.cosign.outputs.version }}
          COSIGN_SHA256_ACTUAL: ${{ steps.cosign.outputs.sha256 }}
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v237-raw-evidence"
          cp "$RUNNER_TEMP/v237-build-metadata.json" "$evidence/build-metadata.json"
          cp "$RUNNER_TEMP/v237-validation.json" "$evidence/validation.json"
          jq -n --arg sourceRevision "$SOURCE_REVISION" --arg imageRef "$IMAGE_REF" \
            --arg buildxDigest "$BUILDX_DIGEST" --arg buildxVersion "$BUILDX_VERSION" \
            --arg cosignVersion "$COSIGN_VERSION" --arg cosignSha256 "$COSIGN_SHA256_ACTUAL" \
            '{schema:"mhoo.twenty-v2.37.candidate-raw-evidence/v1",sourceRevision:$sourceRevision,imageReference:$imageRef,buildxClaimedDigest:$buildxDigest,buildxVersion:$buildxVersion,cosign:{version:$cosignVersion,sha256:$cosignSha256}}' >"$evidence/evidence.json"

      - name: Upload raw evidence
        id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mhoo-twenty-v2.37.0-candidate-${{ inputs.candidate_number }}-raw-evidence
          path: ${{ runner.temp }}/v237-raw-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Create and validate final custody receipt
        env:
          BUILDX_DIGEST: ${{ steps.build.outputs.buildx_digest }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.upload-evidence.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
          SOURCE_TREE: ${{ steps.candidate.outputs.source_tree }}
          TAG_ANNOTATION_SHA256: ${{ steps.candidate.outputs.annotation_sha256 }}
          TAG_OBJECT: ${{ steps.candidate.outputs.tag_object }}
          TAGGER_DATE: ${{ steps.candidate.outputs.tagger_date }}
          TAGGER_EMAIL: ${{ steps.candidate.outputs.tagger_email }}
          TAGGER_NAME: ${{ steps.candidate.outputs.tagger_name }}
          WORKFLOW_BLOB: ${{ steps.candidate.outputs.workflow_blob }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/v237-final-receipt"
          mkdir -p "$output"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg workflowPath ".github/workflows/publish-twenty-v2.37.0-candidate.yml" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" --arg workflowSha "$GITHUB_WORKFLOW_SHA" --arg workflowBlob "$WORKFLOW_BLOB" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg sourceTag "$CANDIDATE_SOURCE_TAG" \
            --arg tagObject "$TAG_OBJECT" --arg taggerName "$TAGGER_NAME" --arg taggerEmail "$TAGGER_EMAIL" --arg taggerTimestamp "$TAGGER_DATE" \
            --arg annotationSha256 "$TAG_ANNOTATION_SHA256" --arg sourceCommit "$SOURCE_REVISION" --arg sourceTree "$SOURCE_TREE" \
            --arg upstreamCommit "$EXPECTED_UPSTREAM_COMMIT" --arg upstreamTree "$EXPECTED_UPSTREAM_TREE" --arg buildxDigest "$BUILDX_DIGEST" \
            --arg imageReference "$IMAGE_REF" --arg certificateIdentity "$CERTIFICATE_IDENTITY" --arg certificateIssuer "$CERTIFICATE_OIDC_ISSUER" \
            --arg evidenceId "$EVIDENCE_ARTIFACT_ID" --arg evidenceDigest "$EVIDENCE_ARTIFACT_DIGEST" \
            --slurpfile registry "$RUNNER_TEMP/v237-raw-evidence/registry-readback.json" \
            '{schema:"mhoo.twenty-v2.37.candidate-publication-receipt/v1",repository:$repository,workflow:{path:$workflowPath,ref:$workflowRef,sha:$workflowSha,blobSha:$workflowBlob,runId:$runId,runAttempt:$runAttempt},sourceTag:{name:$sourceTag,objectId:$tagObject,tagger:{name:$taggerName,email:$taggerEmail,timestamp:$taggerTimestamp},annotationSha256:$annotationSha256,peeledCommit:$sourceCommit,sourceTree:$sourceTree},upstream:{tag:"twenty/v2.37.0",commit:$upstreamCommit,tree:$upstreamTree},build:{buildxClaimedDigest:$buildxDigest},publication:{primitive:"digest-only",imageReference:$imageReference,registryReadback:$registry[0]},signature:{certificateIdentity:$certificateIdentity,certificateIssuer:$certificateIssuer,verification:"passed"},evidenceArtifact:{id:$evidenceId,digest:$evidenceDigest},validation:{source:"passed",disposableRuntime:"passed",registryReadback:"passed",signature:"passed",applicationFilePersistence:"not evaluated; separate gate",deployment:"not authorized",cutover:"not authorized"}}' >"$output/receipt.json"
          jq -e '(.schema == "mhoo.twenty-v2.37.candidate-publication-receipt/v1") and (.repository == "mhoo-os/mhoo-twenty") and (.sourceTag.name|test("^mhoo/candidate/v2\\.37\\.0-[1-9][0-9]*$")) and (.sourceTag.peeledCommit == .workflow.sha) and (.publication.primitive == "digest-only") and (.publication.imageReference|test("^ghcr.io/mhoo-os/mhoo-twenty@sha256:[0-9a-f]{64}$")) and (.build.buildxClaimedDigest == .publication.registryReadback.registryDigestHeader) and (.publication.registryReadback.registryDigestHeader == .publication.registryReadback.rawBodySha256) and (.validation.applicationFilePersistence == "not evaluated; separate gate") and (.validation.deployment == "not authorized") and (.validation.cutover == "not authorized")' "$output/receipt.json" >/dev/null

      - name: Upload final custody receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mhoo-twenty-v2.37.0-candidate-${{ inputs.candidate_number }}-final-receipt
          path: ${{ runner.temp }}/v237-final-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90
