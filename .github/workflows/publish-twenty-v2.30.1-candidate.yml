name: Publish signed Twenty v2.30.1 candidate

on:
  push:
    tags:
      - 'mhoo/candidate/v2.30.1-2'

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-twenty-v2.30.1-candidate-2
  cancel-in-progress: false

env:
  BUILD_ID: mhoo-twenty-v2.30.1-candidate.2
  CANDIDATE_TAG: mhoo/candidate/v2.30.1-2
  CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-twenty-v2.30.1-candidate.yml@${{ github.ref }}
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  IMAGE_REPOSITORY: ghcr.io/mhoo-os/mhoo-twenty
  IMAGE_TAG: ghcr.io/mhoo-os/mhoo-twenty:v2.30.1-2

jobs:
  publish:
    name: Build once, publish, validate, sign, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out immutable candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Resolve and verify candidate identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          expected_ref="refs/tags/${CANDIDATE_TAG}"
          [[ "$GITHUB_REF" == "$expected_ref" ]] || {
            echo "expected ${expected_ref}, got ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "$(git cat-file -t "$expected_ref")" == "tag" ]] || {
            echo "candidate ref must be an annotated tag" >&2
            exit 1
          }

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main

          source_revision="$(git rev-list -n 1 "$expected_ref")"
          tag_object="$(git rev-parse "$expected_ref")"
          [[ "$(git rev-parse HEAD)" == "$source_revision" ]] || {
            echo "checkout does not match the candidate tag" >&2
            exit 1
          }
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$source_revision" ]] || {
            echo "candidate tag does not point to canonical main" >&2
            exit 1
          }

          {
            echo "source_revision=${source_revision}"
            echo "tag_object=${tag_object}"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch canonical upstream objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/twentyhq/twenty.git \
            refs/tags/twenty/v2.30.0 \
            refs/tags/twenty/v2.30.1

      - name: Verify exact source and controlled overlay
        run: scripts/provenance/verify-source.sh

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing candidate tag
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "${IMAGE_TAG} already exists; refusing to rebuild or move it" >&2
            exit 1
          fi

      - name: Build once and push candidate
        id: build
        env:
          METADATA_PATH: ${{ runner.temp }}/candidate-build-metadata.json
          OUTPUT_MODE: registry
          SOURCE_REPOSITORY: https://github.com/mhoo-os/mhoo-twenty
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/provenance/build-candidate.sh

          digest="$(jq -r '."containerimage.digest" // empty' "$METADATA_PATH")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "BuildKit did not report a registry digest" >&2
            exit 1
          }

          {
            echo "digest=${digest}"
            echo "image_ref=${IMAGE_REPOSITORY}@${digest}"
            echo "metadata_path=${METADATA_PATH}"
          } >>"$GITHUB_OUTPUT"

      - name: Pull the exact published digest
        env:
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Validate the exact published digest
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.build.outputs.image_ref }}
          REPORT_PATH: ${{ runner.temp }}/candidate-validation.json
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        run: scripts/provenance/validate-candidate.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.3

      - name: Sign the validated digest with GitHub OIDC
        env:
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify the digest-bound keyless signature
        env:
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
          VERIFICATION_PATH: ${{ runner.temp }}/cosign-verification.json
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            --output json \
            "$IMAGE_REF" | tee "$VERIFICATION_PATH"
          jq -e 'length > 0' "$VERIFICATION_PATH" >/dev/null

      - name: Record candidate custody receipt
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
          TAG_OBJECT: ${{ steps.candidate.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_directory="$RUNNER_TEMP/candidate-custody"
          mkdir -p "$receipt_directory"

          cp "$RUNNER_TEMP/candidate-build-metadata.json" \
            "$receipt_directory/build-metadata.json"
          cp "$RUNNER_TEMP/candidate-validation.json" \
            "$receipt_directory/validation.json"
          cp "$RUNNER_TEMP/cosign-verification.json" \
            "$receipt_directory/signature-verification.json"

          jq -n \
            --arg buildId "$BUILD_ID" \
            --arg candidateTag "$CANDIDATE_TAG" \
            --arg candidateTagObject "$TAG_OBJECT" \
            --arg certificateIdentity "$CERTIFICATE_IDENTITY" \
            --arg certificateOidcIssuer "$CERTIFICATE_OIDC_ISSUER" \
            --arg digest "$CANDIDATE_DIGEST" \
            --arg imageRef "$IMAGE_REF" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg workflowRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              result: "passed",
              candidateTag: $candidateTag,
              candidateTagObject: $candidateTagObject,
              sourceRevision: $sourceRevision,
              buildId: $buildId,
              imageRef: $imageRef,
              digest: $digest,
              validation: "passed",
              signature: {
                mode: "keyless",
                certificateIdentity: $certificateIdentity,
                certificateOidcIssuer: $certificateOidcIssuer,
                verification: "passed"
              },
              workflowRun: $workflowRun,
              nonClaims: ["sbom", "slsa-or-in-toto-attestation", "vulnerability-policy"]
            }' >"$receipt_directory/custody.json"

          {
            echo "## Signed migration candidate"
            echo
            echo "- Source revision: \`${SOURCE_REVISION}\`"
            echo "- Candidate tag: \`${CANDIDATE_TAG}\`"
            echo "- Digest-only image: \`${IMAGE_REF}\`"
            echo "- Build validation: PASS"
            echo "- Keyless signature verification: PASS"
            echo "- Rehearsal and deployment: not performed"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve custody receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mhoo-twenty-v2.30.1-candidate-2-custody
          path: ${{ runner.temp }}/candidate-custody/
          if-no-files-found: error
          retention-days: 90
