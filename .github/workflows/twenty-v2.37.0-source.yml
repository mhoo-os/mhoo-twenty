name: Twenty v2.37.0 Source Custody

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Fetch the governed upstream release object
        run: |
          git fetch --depth=1 https://github.com/twentyhq/twenty.git \
            refs/tags/twenty/v2.37.0

      - name: Validate provenance scripts
        run: |
          bash -n scripts/provenance/build-v2.37.0-candidate.sh
          bash -n scripts/provenance/publish-oci-layout.sh
          bash -n scripts/provenance/test-candidate-6-oci-publication.sh
          bash -n scripts/provenance/verify-source.sh
          bash -n scripts/provenance/test-verify-source.sh
          bash -n scripts/provenance/validate-v2.37.0-candidate.sh
          bash -n scripts/provenance/validate-v2.37.0-publication-workflow.sh
          python3 -m py_compile \
            scripts/ci/classify_front_change.py \
            scripts/ci/test_classify_front_change.py \
            scripts/provenance/verify_bounded_readme_overlay.py \
            scripts/provenance/test_verify_bounded_readme_overlay.py

      - name: Provision pinned actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tools="$RUNNER_TEMP/actionlint"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tar -xzf "$archive" -C "$tools" actionlint
          chmod 0755 "$tools/actionlint"
          "$tools/actionlint" -version | grep -Fx '1.7.12'
          echo "$tools" >>"$GITHUB_PATH"

      - name: Validate publication workflow contract
        run: scripts/provenance/validate-v2.37.0-publication-workflow.sh

      - name: Run digest-only OCI publication regression proof
        run: scripts/provenance/test-candidate-6-oci-publication.sh

      - name: Validate candidate image-label templates with Docker
        run: |
          docker image inspect registry:2 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' >/dev/null
          docker image inspect registry:2 --format '{{index .Config.Labels "org.opencontainers.image.version"}}' >/dev/null
          docker image inspect registry:2 --format '{{index .Config.Labels "io.mhoo.build.id"}}' >/dev/null

      - name: Validate fail-closed frontend classification
        run: python3 scripts/ci/test_classify_front_change.py

      - name: Verify exact source and controlled overlay
        run: scripts/provenance/verify-source.sh

      - name: Run hostile provenance regression tests
        run: scripts/provenance/test-verify-source.sh

      - name: Check patch whitespace
        run: |
          exact_source_commit="$(sed -n 's/^MHOO_TWENTY_EXACT_SOURCE_COMMIT=//p' .twenty-source)"
          test -n "$exact_source_commit"
          git diff --check "${exact_source_commit}..HEAD"
