name: Twenty v2.30.1 provenance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twenty-v2.30.1-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-trust:
    name: Verify canonical source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Fetch canonical upstream objects
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/twentyhq/twenty.git \
            refs/tags/twenty/v2.30.0 \
            refs/tags/twenty/v2.30.1

      - name: Verify source trust boundary
        run: scripts/provenance/verify-source.sh

  candidate-runtime:
    name: Build and validate candidate
    needs: source-trust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_ID: mhoo-twenty-v2.30.1-candidate.1
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_NAME: mhoo-os/mhoo-twenty:mhoo-twenty-v2.30.1-candidate.1

    steps:
      - name: Check out proposed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Fetch canonical upstream objects
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/twentyhq/twenty.git \
            refs/tags/twenty/v2.30.0 \
            refs/tags/twenty/v2.30.1

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build candidate from canonical repository revision
        env:
          OUTPUT_MODE: docker
          SOURCE_REPOSITORY: https://github.com/mhoo-os/mhoo-twenty
          SOURCE_REVISION: ${{ env.EXPECTED_SOURCE_SHA }}
        run: scripts/provenance/build-candidate.sh

      - name: Validate disposable runtime
        env:
          SOURCE_REVISION: ${{ env.EXPECTED_SOURCE_SHA }}
        run: scripts/provenance/validate-candidate.sh
