name: Spawn Twenty App Dev Test
description: >
  Starts a Twenty all-in-one test instance (server, worker, database, redis)
  using the immutable governed twentycrm/twenty-app-dev Docker image on port 2021.
  The server is available at http://localhost:2021 with seeded demo data.

inputs:
  twenty-version:
    description: 'Immutable Twenty Docker image version (e.g., "v2.37.0@sha256:<digest>").'
    required: false
    default: 'v2.37.0@sha256:53381e68f6fa50808f624f4c0125ce2143c6d21321ba25886e1115c73367c6e6'

outputs:
  server-url:
    description: 'URL where the Twenty test server can be reached'
    value: http://localhost:2021
  api-key:
    description: 'Access token for the seeded Twenty dev workspace'
    value: ${{ steps.authenticate.outputs.access-token }}

runs:
  using: 'composite'
  steps:
    - name: Start twenty-app-dev-test container
      shell: bash
      run: |
        VERSION="${{ inputs.twenty-version }}"
        if [[ "$VERSION" != *@sha256:* ]]; then
          echo "::error::twenty-version must include an immutable @sha256 digest"
          exit 1
        fi

        docker run -d \
          --name twenty-app-dev-test \
          -p 2021:2021 \
          -e NODE_PORT=2021 \
          -e SERVER_URL=http://localhost:2021 \
          -e MARKETPLACE_CATALOG_SYNC_CRON_ENABLED=false \
          -e API_RATE_LIMITING_SHORT_LIMIT=100000 \
          -e API_RATE_LIMITING_LONG_LIMIT=100000 \
          "twentycrm/twenty-app-dev:${VERSION}"

        echo "Waiting for Twenty test instance to become healthy…"
        TIMEOUT=180
        ELAPSED=0
        until curl -sf http://localhost:2021/healthz > /dev/null 2>&1; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "::error::Twenty did not become healthy within ${TIMEOUT}s"
            docker logs twenty-app-dev-test 2>&1 | tail -80
            exit 1
          fi
          sleep 3
          ELAPSED=$((ELAPSED + 3))
          echo "  … waited ${ELAPSED}s"
        done
        echo "Twenty test instance is ready at http://localhost:2021 (took ~${ELAPSED}s)"

    - name: Mint seeded user access token
      id: authenticate
      shell: bash
      run: |
        set -euo pipefail

        APP_URL=http://localhost:2021
        LOGIN_PAYLOAD=$(jq -cn --arg origin "$APP_URL" '{
          query: "mutation GetLoginTokenFromCredentials($email: String!, $password: String!, $origin: String!) { getLoginTokenFromCredentials(email: $email, password: $password, origin: $origin) { loginToken { token } } }",
          variables: {
            email: "tim@apple.dev",
            password: "tim@apple.dev",
            origin: $origin
          }
        }')
        LOGIN_TOKEN=$(curl --fail-with-body --silent --show-error \
          --header 'content-type: application/json' \
          --header "Origin: $APP_URL" \
          --data "$LOGIN_PAYLOAD" \
          "$APP_URL/metadata" | jq -er 'if .errors then error("login request failed") else .data.getLoginTokenFromCredentials.loginToken.token end')
        printf '::add-mask::%s\n' "$LOGIN_TOKEN"
        ACCESS_TOKEN_PAYLOAD=$(jq -cn --arg login_token "$LOGIN_TOKEN" --arg origin "$APP_URL" '{
          query: "mutation GetAuthTokensFromLoginToken($loginToken: String!, $origin: String!) { getAuthTokensFromLoginToken(loginToken: $loginToken, origin: $origin) { tokens { accessOrWorkspaceAgnosticToken { token } } } }",
          variables: {
            loginToken: $login_token,
            origin: $origin
          }
        }')
        ACCESS_TOKEN=$(curl --fail-with-body --silent --show-error \
          --header 'content-type: application/json' \
          --header "Origin: $APP_URL" \
          --data "$ACCESS_TOKEN_PAYLOAD" \
          "$APP_URL/metadata" | jq -er 'if .errors then error("access token request failed") else .data.getAuthTokensFromLoginToken.tokens.accessOrWorkspaceAgnosticToken.token end')
        printf '::add-mask::%s\n' "$ACCESS_TOKEN"

        printf 'access-token=%s\n' "$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
